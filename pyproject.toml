[project]
name = "lanbao-ws"
version = "0.5.0"
description = "揽宝智能投研交易平台 - 基于ROS2分布式架构的量化投研交易系统"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "揽宝开发团队", email = "ten2net@163.com" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    # 基础框架
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    # ROS2相关
    "rosdep>=0.26.0",
    # 数据源
    "tushare>=1.2.89",
    "akshare>=1.10.0",
    "pytdx>=1.72",
    "requests>=2.31.0",
    "websocket-client>=1.6.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    # 数据存储
    "duckdb>=0.9.0",
    "sqlalchemy>=2.0.0",
    # 回测和计算
    "vectorbt>=0.24.0",
    "TA-Lib>=0.4.28",
    # Web界面
    "streamlit>=1.28.0",
    "plotly>=5.17.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "python-multipart>=0.0.17",
    # Jupyter环境
    "jupyterlab>=4.0.0",
    "ipywidgets>=8.1.0",
    # 工具库
    "pydantic>=2.4.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "loguru>=0.7.0",
    "tqdm>=4.66.0",
    "hatch>=1.16.3",
    "empy==3.3.4",
    # 系统监控
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/lanbao/lanbao-ws"
Repository = "https://github.com/lanbao/lanbao-ws"
Documentation = "https://docs.lanbao.com"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
