# 揽宝智能投研交易平台 - Docker Compose 开发配置
# 开发模式：挂载源码目录，支持实时修改和调试
#
# 使用方式:
#   docker compose -f docker-compose.dev.yml build      # 构建镜像
#   docker compose -f docker-compose.dev.yml up -d      # 启动所有服务
#   docker compose -f docker-compose.dev.yml logs -f    # 查看日志
#   docker compose -f docker-compose.dev.yml down       # 停止并移除服务
#
# 注意: 首次启动或源码变更后，需要重新构建镜像以更新 install/ 目录

services:
  # 核心服务: core_node + rosbridge WebSocket
  lanbao-core:
    build:
      context: .
      dockerfile: Dockerfile
    image: lanbao:latest
    container_name: lanbao-core
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - TUSHARE_TOKEN=${TUSHARE_TOKEN}
      - LANBAO_LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - .:/workspace
      - ./data:/workspace/data
      - ./logs:/workspace/logs
      - ./config:/workspace/config
    networks:
      - lanbao-network
    ports:
      - "9090:9090"  # rosbridge WebSocket
    restart: unless-stopped
    command: ros2 launch lanbao_core lanbao.launch.py

  # 市场数据节点
  market-data:
    image: lanbao:latest
    container_name: lanbao-market-data
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - TUSHARE_TOKEN=${TUSHARE_TOKEN}
      - LANBAO_DATA_SOURCES=${LANBAO_DATA_SOURCES:-tushare,akshare}
      - QMT_PATH=${QMT_PATH}
      - QMT_ACCOUNT_ID=${QMT_ACCOUNT_ID}
    volumes:
      - .:/workspace
      - ./data:/workspace/data
      - ./logs:/workspace/logs
    networks:
      - lanbao-network
    depends_on:
      - lanbao-core
    restart: unless-stopped
    command: ros2 run lanbao_data market_data_node

  # 数据同步节点
  data-sync:
    image: lanbao:latest
    container_name: lanbao-data-sync
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - TUSHARE_TOKEN=${TUSHARE_TOKEN}
    volumes:
      - .:/workspace
      - ./data:/workspace/data
      - ./logs:/workspace/logs
    networks:
      - lanbao-network
    depends_on:
      - lanbao-core
      - market-data
    restart: unless-stopped
    command: ros2 run lanbao_data data_sync_node

  # 回测引擎节点
  backtest-engine:
    image: lanbao:latest
    container_name: lanbao-backtest
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    volumes:
      - .:/workspace
      - ./data:/workspace/data
      - ./logs:/workspace/logs
    networks:
      - lanbao-network
    depends_on:
      - lanbao-core
      - market-data
    restart: unless-stopped
    command: ros2 run lanbao_backtest backtest_engine_node

  # 策略管理节点
  strategy-manager:
    image: lanbao:latest
    container_name: lanbao-strategy
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    volumes:
      - .:/workspace
      - ./data:/workspace/data
      - ./config:/workspace/config
      - ./logs:/workspace/logs
    networks:
      - lanbao-network
    depends_on:
      - lanbao-core
      - market-data
    restart: unless-stopped
    command: ros2 run lanbao_strategy strategy_manager_node

  # 风险控制节点
  risk-control:
    image: lanbao:latest
    container_name: lanbao-risk
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    volumes:
      - .:/workspace
      - ./data:/workspace/data
      - ./logs:/workspace/logs
    networks:
      - lanbao-network
    depends_on:
      - lanbao-core
      - strategy-manager
    restart: unless-stopped
    command: ros2 run lanbao_risk risk_control_node

  # 监控节点
  monitor:
    image: lanbao:latest
    container_name: lanbao-monitor
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    volumes:
      - .:/workspace
      - ./data:/workspace/data
      - ./logs:/workspace/logs
    networks:
      - lanbao-network
    depends_on:
      - lanbao-core
    restart: unless-stopped
    command: ros2 run lanbao_monitor monitor_node

  # 系统指标节点
  system-metrics:
    image: lanbao:latest
    container_name: lanbao-system-metrics
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    volumes:
      - .:/workspace
      - ./data:/workspace/data
      - ./logs:/workspace/logs
    networks:
      - lanbao-network
    depends_on:
      - lanbao-core
      - monitor
    restart: unless-stopped
    command: ros2 run lanbao_monitor system_metrics_node

  # Jupyter 研究环境
  jupyter:
    image: lanbao:latest
    container_name: lanbao-jupyter
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - TUSHARE_TOKEN=${TUSHARE_TOKEN}
      - PYTHONPATH=/workspace/src:/workspace/install
    volumes:
      - .:/workspace
      - ./data:/workspace/data
      - ./notebooks:/workspace/notebooks
      - ./config:/workspace/config
      - ./src:/workspace/src
    ports:
      - "8888:8888"
    networks:
      - lanbao-network
    restart: unless-stopped
    command: >
      bash -c "source /opt/ros/humble/setup.bash
      && source /workspace/install/setup.bash
      && jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''"

  # Web 监控界面 (Streamlit)
  web:
    image: lanbao:latest
    container_name: lanbao-web
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    volumes:
      - .:/workspace
      - ./data:/workspace/data
      - ./config:/workspace/config
      - ./src:/workspace/src
    ports:
      - "8501:8501"
    networks:
      - lanbao-network
    depends_on:
      - lanbao-core
      - monitor
    restart: unless-stopped
    command: streamlit run /workspace/src/lanbao_monitor/dashboard.py --server.port=8501 --server.address=0.0.0.0

networks:
  lanbao-network:
    driver: bridge

volumes:
  lanbao-data:
  lanbao-logs:
