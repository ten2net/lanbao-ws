# RSI策略配置

strategy_id: "rsi_default"
strategy_name: "RSI策略"
strategy_type: "momentum"

parameters:
  period: 14
  oversold: 30
  overbought: 70
  position_size: 0.1
  stop_loss: 0.05
  take_profit: 0.1

symbols:
  - "000001.SZ"
  - "000858.SZ"

risk_limits:
  max_position_size: 0.2
  max_drawdown: 0.1

enabled: true
